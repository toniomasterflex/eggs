<!-- Logotype "Egg" (style "06 Mascot" de la planche de logo du 28/09/2026).
     Corrigée le 28/09/2026 après un premier essai qui s'écartait trop de
     la référence (contour foncé inventé autour des lettres, alors que
     l'original est en aplat crème sans contour) : mesurée et redessinée
     en vectoriel directement à partir de la planche (couleurs et
     proportions relevées dessus). Utilisée dans la barre de titre du
     panneau (voir panel-titlebar-logo dans App.tsx / pinned.css) ; asset
     gardé ici pour d'autres emplacements futurs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ===== Lettre E (traits ronds pleins, sans contour foncé) ===== -->
  <g fill="none" stroke="#faeef6" stroke-linecap="round" stroke-linejoin="round" stroke-width="26">
    <line x1="40" y1="30" x2="40" y2="130"/>
    <line x1="40" y1="30" x2="98" y2="30"/>
    <line x1="40" y1="80" x2="88" y2="80"/>
    <line x1="40" y1="130" x2="98" y2="130"/>
  </g>

  <!-- ===== Lettre g (bulbe + queue) ===== -->
  <g fill="none" stroke="#faeef6" stroke-linecap="round" stroke-linejoin="round" stroke-width="26">
    <circle cx="150" cy="92" r="26" stroke-width="26"/>
    <path d="M150,118 C150,150 128,158 112,150"/>
  </g>

  <!-- ===== Mascotte oeuf (remplace le 2e g) ===== -->
  <g transform="translate(272,90)">
    <!-- couronne : 3 pointes roses -->
    <ellipse cx="-30" cy="-70" rx="13" ry="30" fill="#f4058a" transform="rotate(-14 -30 -70)"/>
    <ellipse cx="6" cy="-84" rx="13" ry="32" fill="#f4058a" transform="rotate(4 6 -84)"/>
    <ellipse cx="42" cy="-70" rx="13" ry="30" fill="#f4058a" transform="rotate(24 42 -70)"/>
    <!-- oeuf : rond/dodu, comme la référence -->
    <path d="M0,-64
             C42,-64 78,-14 78,28
             C78,74 44,104 0,104
             C-44,104 -78,74 -78,28
             C-78,-14 -42,-64 0,-64
             Z"
          fill="#faeef6"/>
    <circle cx="-25" cy="6" r="11" fill="#171018"/>
    <circle cx="25" cy="6" r="11" fill="#171018"/>
  </g>
</svg>
