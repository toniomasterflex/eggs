<!-- Icône de l'app (style "08 Solid" de la planche de logo du 28/09/2026).
     Corrigée le 28/09/2026 après un premier essai qui s'écartait trop de
     la référence (inventait des yeux absents de ce variant, mauvaise
     couleur/position des pointes) : mesurée et redessinée en vectoriel
     directement à partir de la planche (fond plat, extraction impossible
     telle quelle car pas transparent, mais proportions/couleurs relevées
     précisément dessus). Source du PNG 1024×1024 utilisé par
     `npx tauri icon` pour générer src-tauri/icons/, et du favicon web
     (public/favicon.svg, copie de ce fichier). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="512" height="512" rx="118" ry="118" fill="#ef047b"/>
  <!-- oeuf : pas de visage sur ce variant (contrairement aux autres de la planche) -->
  <path d="M244,86
           C312,86 372,190 372,282
           C372,374 316,432 244,432
           C172,432 116,374 116,282
           C116,190 176,86 244,86
           Z"
        fill="#faeef6"/>
  <!-- 2 pointes blanches (pas roses : le fond est déjà rose sur ce variant) -->
  <ellipse cx="358" cy="120" rx="20" ry="46" fill="#faeef6" transform="rotate(-10 358 120)"/>
  <ellipse cx="410" cy="158" rx="20" ry="44" fill="#faeef6" transform="rotate(38 410 158)"/>
</svg>
